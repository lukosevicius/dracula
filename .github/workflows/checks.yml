name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seeker:
    name: Seeker tests and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seeker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seeker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  mariadb:
    name: API MariaDB integration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dracula_test
          MARIADB_USER: dracula_test
          MARIADB_PASSWORD: test-only-password
          MARIADB_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: api
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: '3306'
      MYSQL_TEST_USER: dracula_test
      MYSQL_TEST_PASSWORD: test-only-password
      MYSQL_TEST_DATABASE: dracula_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:mariadb

  client:
    name: Client types and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      EXPO_PUBLIC_API_URL: https://api.dracula.lt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check web output
        run: test -s dist/index.html && test -s dist/.htaccess
