name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  migration-notice:
    name: Flag database migration changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remind maintainers to prepare production migrations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::warning::Cannot determine the previous commit; review API migrations manually."
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::Previous commit is unavailable; review API migrations manually."
            exit 0
          fi
          changes=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- api/migrations/)
          if [[ -n "$changes" ]]; then
            echo "::warning::Publish API release applies pending migrations from main after checks pass. Review compatibility and backups before merging."
            {
              echo '### Production database migration required'
              echo 'Review compatibility with the currently deployed API and verify a backup before merging. **Publish API release** applies pending migrations before deploying the API.'
              echo 'Changed migration files:'
              echo '```'
              printf '%s\n' "$changes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  seeker:
    name: Seeker tests and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seeker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seeker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: node --test ../.github/scripts/verify-api-deployment.test.mjs
      - run: node --import tsx --test ../client/test/calendar.test.ts ../client/test/saved-groups.test.ts ../client/test/event-transition.test.ts
      - run: npm test
      - run: npm run typecheck:nest
      - run: npm run typecheck:tests
      - run: npm run test:nest

  mariadb:
    name: API MariaDB integration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dracula_test
          MARIADB_USER: dracula_test
          MARIADB_PASSWORD: test-only-password
          MARIADB_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: api
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: '3306'
      MYSQL_TEST_USER: dracula_test
      MYSQL_TEST_PASSWORD: test-only-password
      MYSQL_TEST_DATABASE: dracula_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:mariadb
      - run: npm run test:production

  client:
    name: Client types and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      EXPO_PUBLIC_API_URL: https://api.dracula.lt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check web output
        run: test -s dist/index.html && test -s dist/.htaccess
