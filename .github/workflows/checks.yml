name: Checks

# Runs only the checks for the parts a change touches: API, Seeker or client. The deploy workflows call this
# before publishing, so a push to main is checked by the deploys it triggers rather than a separate run.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    name: Find changed parts
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      seeker: ${{ steps.diff.outputs.seeker }}
      client: ${{ steps.diff.outputs.client }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        name: Compare with the previous revision and flag migrations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          all() { printf 'api=true\nseeker=true\nclient=true\n' >> "$GITHUB_OUTPUT"; }
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::Cannot determine the previous commit; running every check. Review API migrations manually."
            all; exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          # Shared workflow and script changes affect every part.
          shared=$(has '^\.github/(workflows/checks\.yml|scripts/)')
          api=$(has '^api/'); seeker=$(has '^seeker/')
          # The client builds with Seeker's date filters and types.
          client=$(has '^(client/|seeker/public/event-date-filters\.ts$|seeker/types\.ts$)')
          if [[ "$shared" == true ]]; then api=true; seeker=true; client=true; fi
          printf 'api=%s\nseeker=%s\nclient=%s\n' "$api" "$seeker" "$client" >> "$GITHUB_OUTPUT"
          echo "Changed parts: api=$api seeker=$seeker client=$client"
          changes=$(grep -E '^api/migrations/' <<< "$files" || true)
          if [[ -n "$changes" ]]; then
            echo "::warning::Publish API release applies pending migrations from main after checks pass. Review compatibility and backups before merging."
            {
              echo '### Production database migration required'
              echo 'Review compatibility with the currently deployed API and verify a backup before merging. **Publish API release** applies pending migrations before deploying the API.'
              echo 'Changed migration files:'
              echo '```'
              printf '%s\n' "$changes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  seeker:
    name: Seeker tests and types
    needs: changes
    if: needs.changes.outputs.seeker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seeker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seeker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  api:
    name: API tests
    needs: changes
    # Also runs the client's unit tests, which use the API's TypeScript runner.
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: node --test ../.github/scripts/verify-api-deployment.test.mjs
      - run: node --import tsx --test ../client/test/calendar.test.ts ../client/test/event-url.test.ts ../client/test/saved-groups.test.ts ../client/test/event-transition.test.ts ../client/test/showtimes.test.ts
      - run: npm test
      - run: npm run typecheck:nest
      - run: npm run typecheck:tests
      - run: npm run test:nest

  mariadb:
    name: API MariaDB integration
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dracula_test
          MARIADB_USER: dracula_test
          MARIADB_PASSWORD: test-only-password
          MARIADB_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: api
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: '3306'
      MYSQL_TEST_USER: dracula_test
      MYSQL_TEST_PASSWORD: test-only-password
      MYSQL_TEST_DATABASE: dracula_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run test:mariadb
      - run: npm run test:production

  client:
    name: Client types and web build
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      EXPO_PUBLIC_API_URL: https://api.dracula.lt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check web output
        run: test -s dist/index.html && test -s dist/.htaccess
