name: Scheduled import

# Imports Avilys into the production database and merges confident duplicates.
# Vilnius Events refuses requests from GitHub's servers (HTTP 403), so its import runs from a Mac instead:
# see seeker/scripts/vn-import.sh. Times are UTC: 05:00 and 12:00 in Vilnius during winter, an hour later in summer.
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-import
  cancel-in-progress: false

jobs:
  import:
    name: Import events
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production-imports
    defaults:
      run:
        working-directory: seeker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seeker/package-lock.json
      - run: npm ci
      - run: npm run build:server
      - name: Run import
        env:
          CENTRAL_API_URL: ${{ vars.CENTRAL_API_URL || 'https://api.dracula.lt' }}
          CENTRAL_API_TOKEN: ${{ secrets.CENTRAL_API_TOKEN }}
        run: node dist/scheduled-import.js nightly --sources=avilys
