name: Scheduled import

# Fetches Vilnius Events and Avilys into the production database, refreshes upcoming event details,
# handles listings the sources took down and merges confident duplicates.
# Times are UTC: 05:00 and 12:00 in Vilnius during winter, an hour later in summer.
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'nightly fetches every Vilnius Events page; midday only the newest'
        type: choice
        options: [nightly, midday]
        default: midday

permissions:
  contents: read

concurrency:
  group: scheduled-import
  cancel-in-progress: false

jobs:
  import:
    name: Import events
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production-imports
    defaults:
      run:
        working-directory: seeker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: seeker/package-lock.json
      - run: npm ci
      - run: npm run build:server
      - name: Run import
        env:
          CENTRAL_API_URL: ${{ vars.CENTRAL_API_URL || 'https://api.dracula.lt' }}
          CENTRAL_API_TOKEN: ${{ secrets.CENTRAL_API_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 3 * * *' && 'nightly' || 'midday') }}
        run: node dist/scheduled-import.js "$MODE"
