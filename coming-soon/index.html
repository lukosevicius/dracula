<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <meta
      name="description"
      content="Dracula is a new home for Lithuanian music. Coming soon."
    />
    <title>Dracula.lt — Coming soon</title>
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #050505;
        color: #f5f2f0;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(
            ellipse at 50% 68%,
            rgb(91 0 13 / 13%),
            transparent 39rem
          ),
          #050505;
      }

      main {
        display: flex;
        min-height: 100svh;
        flex-direction: column;
        align-items: center;
        padding: clamp(2rem, 6vh, 4.5rem) 1.5rem 2.5rem;
        text-align: center;
      }

      .brand {
        display: block;
        width: min(100%, 350px);
        height: auto;
      }

      .message {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 0 4rem;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #e21b2d;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        font-weight: 650;
        letter-spacing: 0.015em;
        line-height: 1;
      }

      .rule {
        width: 3.25rem;
        height: 2px;
        margin: 1.75rem 0 1.25rem;
        border: 0;
        background: #d7192d;
      }

      .tagline {
        margin: 0;
        color: #a9a5a5;
        font-size: clamp(0.95rem, 2.5vw, 1.125rem);
        letter-spacing: 0.025em;
      }

      footer {
        color: #625d5e;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (max-width: 480px) {
        main {
          padding-top: 2rem;
        }

        .brand {
          width: min(78vw, 290px);
        }

        .message {
          padding-bottom: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="brand" src="/images/logo.png" alt="Dracula.lt" />

      <section class="message" aria-labelledby="coming-soon">
        <p class="eyebrow"></p>
        <h1 id="coming-soon">Coming soon</h1>
        <hr class="rule" />
        <p class="tagline"></p>
      </section>

      <footer>Dracula.lt</footer>
    </main>
  </body>
</html>
